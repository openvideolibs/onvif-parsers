name: Update contributors

on:
  push:
    branches:
      - main

# Grant the necessary permissions for the bot to push code and open a PR
permissions:
  contents: write
  pull-requests: write

jobs:
  contrib-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Add every human GitHub contributor to .all-contributorsrc (no-op for
      # existing entries), then regenerate the README table.
      - name: Update contributors
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIVATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install --global all-contributors-cli@7.0.0
          gh api "repos/${{ github.repository }}/contributors" --paginate \
            --jq '.[] | select(.type == "User") | .login' |
            while read -r login; do
              all-contributors add "$login" code
            done
          all-contributors generate

      # Run pre-commit to fix any formatting issues in the regenerated files
      # The '|| true' ensures the workflow doesn't crash if pre-commit makes a fix
      - name: Fix formatting with pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files || true

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          title: "Update contributors"
          commit-message: "chore: update contributors"
          body: "chore: update contributors file with new contributors"
          branch: "all-contributors/update"
          delete-branch: true
